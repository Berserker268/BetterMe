spring.application.name=backend-main

spring.config.import=optional:file:.env[.properties],optional:file:backend-main/.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

app.remember-me-key=${REMEMBER_ME_KEY:dev-only-change-me}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-set}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-set}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.user-name-attribute=email

app.base-url=${APP_BASE_URL:http://localhost:8080}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
