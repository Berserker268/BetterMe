<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - BetterMe</title>
</head>
<body>
    <h1>Login</h1>

    <p th:if="${param.error}">Wrong email or password.</p>
    <p th:if="${param.logout}">You have been logged out.</p>
    <p th:if="${param.registered}">Account created. Please log in.</p>

    <form th:action="@{/login}" method="post">
        <label>Email</label><br>
        <input type="email" name="username" required><br><br>

        <label>Password</label><br>
        <input type="password" name="password" required><br><br>

        <button type="submit">Login</button>
    </form>

    <p>No account? <a th:href="@{/register}">Register</a></p>
</body>
</html>
