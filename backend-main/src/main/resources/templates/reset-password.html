<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password - BetterMe</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-form">
        <h1>Choose a new password</h1>

        <div th:if="${!valid}">
            <div class="message error">This link is invalid or has expired.</div>
            <p class="switch"><a th:href="@{/forgot-password}">Request a new link</a></p>
        </div>

        <div th:if="${valid}">
            <p class="subtitle">At least 8 characters.</p>
            <div class="message error" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="field pw-wrap">
                    <input type="password" name="password" placeholder="New password" aria-label="New password" required>
                    <button type="button" class="pw-toggle">Show</button>
                </div>
                <div class="field">
                    <input type="password" name="confirm" placeholder="Confirm password" aria-label="Confirm password" required>
                </div>
                <button type="submit" class="btn-primary">Save password</button>
            </form>
        </div>
    </div>
    <script th:src="@{/js/auth.js}"></script>
</body>
</html>
