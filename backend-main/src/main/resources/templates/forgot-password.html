<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password - BetterMe</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-form">
        <h1>Forgot password?</h1>
        <p class="subtitle">Enter your email and we will send you a reset link.</p>

        <div class="message success" th:if="${sent}">
            If that email has an account, a reset link is on its way. It works for 30 minutes.
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="field">
                <input type="email" name="email" placeholder="Email" aria-label="Email" required>
            </div>
            <button type="submit" class="btn-primary">Send reset link</button>
        </form>

        <p class="switch"><a th:href="@{/login}">Back to login</a></p>
    </div>
</body>
</html>
