<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - BetterMe</title>
</head>
<body>
    <h1>Register</h1>

    <form th:action="@{/register}" th:object="${registerForm}" method="post">
        <label>Full name</label><br>
        <input type="text" th:field="*{fullName}">
        <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span><br><br>

        <label>Email</label><br>
        <input type="text" th:field="*{email}">
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span><br><br>

        <label>Password</label><br>
        <input type="password" th:field="*{password}">
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span><br><br>

        <button type="submit">Create account</button>
    </form>

    <p>Already have an account? <a th:href="@{/login}">Login</a></p>
</body>
</html>
